[package]
name = "earshot-core"
version = "0.1.0"
edition = "2024"
description = "Earshot engine: Bark speech-to-text, audio capture, segmentation (no UI)"

[dependencies]
anyhow = "1"
cpal = "0.18"
hound = "3"
half = "2"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
parking_lot = "0.13"
realfft = "3"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
