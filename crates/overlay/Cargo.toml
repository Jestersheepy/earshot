[package]
name = "earshot-overlay"
version = "0.1.1"
edition = "2024"
description = "Earshot's always-on-top UI: pill, menu and toasts drawn natively (no webview)"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
parking_lot = "0.13"
tiny-skia = "0.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
