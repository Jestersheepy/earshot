[project]
name = "earshot"
version = "0.1.0"
description = "Local-first floating dictation, voice notes and meeting notes for Windows (CPU only)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "sounddevice>=0.5",
    "PyAudioWPatch>=0.2.12",
    "keyboard>=0.13.5",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.scripts]
earshot = "earshot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earshot*"]
