<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: the dot, in its default teal, with the mic it shows when idle. Rendered to PNG/ICO by
       tools/make_icons.py. -->
  <defs>
    <linearGradient id="disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3cd2b2"/>
      <stop offset="0.55" stop-color="#16a68c"/>
      <stop offset="1" stop-color="#0b7d69"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#003b31" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06372f" flood-opacity="0.28"/>
    </filter>
    <filter id="glyph" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04463a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <circle cx="512" cy="500" r="440" fill="url(#disc)"/>
  </g>
  <circle cx="512" cy="500" r="440" fill="url(#sheen)"/>
  <circle cx="512" cy="500" r="432" fill="none" stroke="url(#rim)" stroke-width="16"/>
  <g transform="translate(512 500) scale(0.9) translate(-512 -495)" filter="url(#glyph)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="58">
    <rect x="420" y="230" width="184" height="330" rx="92" fill="#ffffff" stroke="none"/>
    <path d="M330 452 a182 182 0 0 0 364 0"/>
    <path d="M512 636 v104"/>
    <path d="M420 760 h184"/>
  </g>
</svg>
